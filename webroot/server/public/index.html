	<body>
        <div class="back-to-home">
            <a id="user-state" href="" class="btn btn-icon btn-primary" ><i class="bi bi-person h3"></i></a>
        </div>
        
        <!-- Start -->
        <section class="position-relative zoom-image">
            <div class="bg-overlay image-wrap" ></div>
            <div class="bg-overlay"></div>
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12 p-0">
                        <div class="d-flex flex-column min-vh-100 justify-content-center px-md-5 py-5 px-4">
                            <div class="text-center">
                                <a href=""><img src="assets/images/logo-icon-64.png" alt=""></a>
                            </div>
                            <div class="title-heading text-center my-auto">
                                <div class="wave-effect coming-soon fw-bold display-3 text-white">
                                    <span style="--a:1">L</span>
                                    <span style="--a:2">O</span>
                                    <span style="--a:3">C</span>
                                    <span style="--a:4">A</span>
                                    <span style="--a:5">T</span>
                                    <span style="--a:6">I</span>
                                    <span style="--a:7">O</span>
                                    <span style="--a:8">N</span>
                                    <span style="--a:9">!</span>
                                </div>

                                <div class="subcribe-form mt-4 pt-2">
                                    <form class="d-flex flex-column align-items-center" action="detail.html" method="get" id="locationSearchForm">
                                        <div class="d-flex w-100 mb-3" style="max-width: 600px;">
                                            <input
                                                    type="text"
                                                    name="location"
                                                    id="locationSearch"
                                                    class="form-control me-2 bg-white opacity-6 rounded shadow w-100"
                                                    placeholder="Enter the location to search for listings">
                                            <button class="btn btn-primary" type="submit">Search</button>
                                        </div>
                                        <div class="form-check mt-3 align-items-center">
                                            <input class="form-check-input mr-4 h1" type="checkbox" value="" id="checkLocation">
                                            <label class="form-check-label text-white-50 h3 ms-2 ml-4" for="checkLocation">
                                                Use my location
                                            </label>
                                        </div>
                                    </form>
                                </div>

                            </div>
                            <div class="text-center footer">
                                <p class="mb-0 text-reset">© <script>document.write(new Date().getFullYear())</script> Wesoon. Design with <i class="mdi mdi-heart text-danger"></i> by <a href="https://shreethemes.in/" target="_blank" class="text-reset">Shreethemes</a>.</p>

        <!-- JAVASCRIPTS -->

	    <script src="assets/js/ext/app.js"></script>
        <script src="assets/js/cookies.js"></script>
        <script src="assets/js/auth.js"></script>
        <script>

            checkUserStatus().then(isLogged =>{
                if(isLogged === true){
                    document.getElementById('user-state').innerHTML = 
                    `<a id="log-out" title="Log Out" href="">Log Out</a>`;

                    document.getElementById('my-account').href="dashboard.html";

                    document.getElementById('log-out').addEventListener('click', function() {

                        logout(sessionStorage.getItem('token')).then(function (response){
                            if(response === true){
                                sessionStorage.clear();
                                localStorage.clear();
                                window.location.replace('./detail.html');
                            }
                        });
                    });
                }
                else{
                    document.getElementById('user-state').href ="login.html";
                }
            });

            setInterval(async () => {
            try{
                checkTokenExp();
            } catch(error) {
                alert("Big MF issue");
            }
        }   , 2*60*1000); // Two Min

            document.getElementById('locationSearchForm').addEventListener('submit', function(event) {
                const field1 = document.getElementById('locationSearch');
                const checkbox = document.getElementById('checkLocation');


                if (field1.value.length === 0 && !checkbox.checked) {
                    event.preventDefault(); // Prevent form submission
                    alert('Please enter a location or check "Use my location".'); // Display an error message
                    return;
                }
                // If either field is filled, allow submission
            });

        </script>

    </body>
